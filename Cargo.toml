[package]
name = "tatara"
version = "0.1.0"
edition = "2024"
description = "An AI-native 3D editor"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rsasaki0109/Tatara"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
futures-util = "0.3.34"
glam = "0.34.1"
reqwest = { version = "0.13.5", features = ["json"] }
schemars = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[profile.release]
opt-level = 3
